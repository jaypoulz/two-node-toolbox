---
- name: "[verify] Wait for topology transition and operators to stabilize (up to 20 minutes)"
  shell: |
    OUTPUT=$(oc adm transition topology status 2>&1)
    echo "$OUTPUT"

    # The status command already validates everything - just check its output
    # Success indicators: "No transition in progress" and "All cluster operators healthy"
    if echo "$OUTPUT" | grep -q "No transition in progress"; then
      if echo "$OUTPUT" | grep -q "All cluster operators healthy"; then
        echo "VERIFICATION_COMPLETE: Topology stable and all operators healthy"
        exit 0
      fi
    fi

    # If we get here, still transitioning or operators not yet healthy
    exit 1
  environment: "{{ sno_oc_env }}"
  register: transition_status
  changed_when: false
  failed_when: false
  retries: 120
  delay: 10
  until: >-
    transition_status is defined and
    transition_status.rc is defined and
    transition_status.rc == 0

- name: "[verify] Display cluster operator status"
  debug:
    msg: "{{ transition_status.stdout }}"
  when: transition_status is defined

- name: "[verify] Check operator stability"
  fail:
    msg: "Cluster operators did not stabilize after 20 minutes. See status output above."
  when:
    - transition_status is defined
    - transition_status.rc != 0

- name: "[verify] Get node count and status"
  shell: |
    oc get nodes --no-headers
  environment: "{{ sno_oc_env }}"
  register: verify_nodes
  changed_when: false

- name: "[verify] Nodes"
  debug:
    msg: "{{ verify_nodes.stdout }}"

- name: "[verify] Get topology"
  shell: |
    oc get infrastructure cluster -o jsonpath='{.status.controlPlaneTopology}'
  environment: "{{ sno_oc_env }}"
  register: verify_topo
  changed_when: false

- name: "[verify] Topology"
  debug:
    msg: "Control plane topology: {{ verify_topo.stdout }}"

- name: "[verify] Get etcd member count"
  shell: |
    oc get pods -n openshift-etcd -l app=etcd --no-headers | wc -l
  environment: "{{ sno_oc_env }}"
  register: verify_etcd
  changed_when: false

- name: "[verify] etcd members"
  debug:
    msg: "etcd pods: {{ verify_etcd.stdout | trim }}"

- name: "[verify] Get cluster operator summary"
  shell: |
    TOTAL=$(oc get co -o json | jq '.items | length')
    DEGRADED=$(oc get co -o json | jq -r '[.items[] | select(.status.conditions[] | select(.type=="Degraded" and .status=="True")) | .metadata.name] | if length > 0 then join(",") else "none" end')
    UNAVAILABLE=$(oc get co -o json | jq -r '[.items[] | select(.status.conditions[] | select(.type=="Available" and .status=="False")) | .metadata.name] | if length > 0 then join(",") else "none" end')
    echo "Total COs: ${TOTAL}"
    echo "Degraded: ${DEGRADED}"
    echo "Unavailable: ${UNAVAILABLE}"
  environment: "{{ sno_oc_env }}"
  register: verify_co
  changed_when: false

- name: "[verify] Cluster operators"
  debug:
    msg: "{{ verify_co.stdout }}"

- name: "[verify] Get MCP master status"
  shell: |
    oc get mcp master --no-headers
  environment: "{{ sno_oc_env }}"
  register: verify_mcp
  changed_when: false

- name: "[verify] MCP status"
  debug:
    msg: "{{ verify_mcp.stdout }}"

- name: "[verify] Assert 3 nodes"
  assert:
    that: (verify_nodes.stdout_lines | length) >= 3
    fail_msg: "Expected 3+ nodes, found {{ verify_nodes.stdout_lines | length }}"

- name: "[verify] Assert HA topology"
  assert:
    that: verify_topo.stdout == "HighlyAvailable"
    fail_msg: "Expected HighlyAvailable, got {{ verify_topo.stdout }}"

- name: "[verify] Assert 3 etcd members"
  assert:
    that: verify_etcd.stdout | trim | int >= 3
    fail_msg: "Expected 3+ etcd pods, found {{ verify_etcd.stdout | trim }}"

- name: "[verify] SNO to 3-node transition verified successfully"
  debug:
    msg: >-
      MIGRATION COMPLETE: {{ verify_nodes.stdout_lines | length }} nodes,
      {{ verify_etcd.stdout | trim }} etcd members,
      topology={{ verify_topo.stdout }}.
